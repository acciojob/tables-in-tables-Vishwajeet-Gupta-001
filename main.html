<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
	<style>
        .main-table {
            width: 510px;
            height: 285px;
            border: 1px solid black;
            border-spacing: 2px;
        }

        .main-table td {
            border: 1px solid black;
            width: 50%;
            padding: 2px;
            vertical-align: middle;
        }

        .nested-table {
            width: 100%;
            border: 1px solid black;
            border-spacing: 2px;
        }

        .nested-table th,
        .nested-table td {
            border: 1px solid black;
            padding: 2px;
        }

        .nested-table th {
            text-align: center;
        }

        .black-cell {
            background-color: black;
            color: white;
            text-align: center;
            font-weight: bold;
        }

        ul {
            margin: 10px 0;
        }
    </style>
  </head>
  <body>
    <table class="main-table">
        <tr>
        <!-- Nested Table 2 -->
        <td>
            <table class="nested-table">
                <tr>
                    <th colspan="2">Nested Table 2</th>
                </tr>
                <tr>
                    <th>Column 1</th>
                    <th>Column 2</th>
                </tr>
                <tr>
                    <td>abc</td>
                    <td>def</td>
                </tr>
            </table>
        </td>

        <!-- Nested Table 1 -->
        <td>
            <table class="nested-table">
                <tr>
                    <th>Nested Table 1</th>
                </tr>
                <tr>
                    <td>
                        <ul>
                            <li>List item 1</li>
                            <li>List item 2</li>
                            <li>List item 3</li>
                        </ul>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <!-- Nested Table 3 -->
        <td>
            <table class="nested-table">
                <tr>
                    <th colspan="2">Nested Table 3</th>
                </tr>
                <tr>
                    <td>
                        <a href="#">Nested Table</a>
                    </td>
                    <td>Demo Continued</td>
                </tr>
            </table>
        </td>

        <!-- Nested Table 4 -->
        <td>
            <table class="nested-table">
                <tr>
                    <th>Nested Table 4</th>
                </tr>
                <tr>
                    <td class="black-cell">HTML</td>
                </tr>
            </table>
        </td>
    </tr>
    </table>
  </body>
</html>
